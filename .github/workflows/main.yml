name: Build Android APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Fix Adaptive Icon XML References
        run: |
          # Automatically point adaptive icon XMLs to drawable assets if they reference missing mipmaps
          find android/app/src/main/res/mipmap-anydpi-v26 -name "*.xml" -exec sed -i 's|@mipmap/ic_launcher_background|@drawable/ic_launcher_background|g' {} +
          find android/app/src/main/res/mipmap-anydpi-v26 -name "*.xml" -exec sed -i 's|@mipmap/ic_launcher_foreground|@drawable/ic_launcher_foreground|g' {} +

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
